stages:
  - build

variables:
  BUILD_NAME: "ktas-trainer"
  BUILD_PATH: "build"
  GIT_DEPTH: "1"
  # Applied to GitLab Runner's checkout Git process, before any job script runs.
  # This lets it remove Unity PackageCache entries whose paths exceed MAX_PATH.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "core.longpaths"
  GIT_CONFIG_VALUE_0: "true"

.manual-local-build:
  stage: build
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: manual
    - when: never
build-windows:
  extends: .manual-local-build
  tags:
    - build-on-commit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: never
  variables:
    BUILD_TARGET: "StandaloneWindows64"
  before_script:
    - 'if (-not (Test-Path -LiteralPath "Tools/CI/build-unity.ps1" -PathType Leaf)) { throw "Tools/CI/build-unity.ps1 was not found." }'
  script:
    - '& .\Tools\CI\build-unity.ps1'
  after_script:
    - 'if (Test-Path -LiteralPath $env:BUILD_PATH) { Remove-Item -LiteralPath $env:BUILD_PATH -Recurse -Force }'

build-macos:
  extends: .manual-local-build
  tags:
    - macos-unity
  variables:
    BUILD_TARGET: "StandaloneOSX"
  before_script:
    - test -f "Tools/CI/build-unity.sh"
    - chmod +x "Tools/CI/build-unity.sh"
  script:
    - "Tools/CI/build-unity.sh"
  after_script:
    - rm -rf -- "${BUILD_PATH:?}"

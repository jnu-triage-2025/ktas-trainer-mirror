[project]
name = "code-heatmap"
version = "0.1.0"
description = "Standalone source-code treemap heatmap renderer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
code-heatmap = "code_heatmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_heatmap"]

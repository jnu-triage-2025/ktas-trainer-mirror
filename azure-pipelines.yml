name: ktas-trainer-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - '*'

parameters:
  - name: agentMode
    displayName: 'Agent mode'
    type: string
    default: selfHosted
    values:
      - selfHosted
      - hosted
  - name: buildWindows
    displayName: 'Build Windows player'
    type: boolean
    default: false
  - name: buildMacos
    displayName: 'Build macOS player'
    type: boolean
    default: false

variables:
  buildName: 'ktas-trainer'
  buildPath: 'build'
  windowsAgentPool: 'windowsAgentPool'

stages:
  - stage: Lint
    displayName: 'C# lint'
    jobs:
      - job: LintCSharp
        displayName: 'Roslyn analyzer and format validation'
        pool:
          ${{ if eq(parameters.agentMode, 'hosted') }}:
            vmImage: 'windows-2022'
          ${{ else }}:
            name: $(windowsAgentPool)
        steps:
          - checkout: self
            fetchDepth: 1
          - powershell: |
              if (-not (Test-Path -LiteralPath 'Tools/CI/lint-csharp.ps1' -PathType Leaf)) {
                throw 'Tools/CI/lint-csharp.ps1 was not found.'
              }
              & .\Tools\CI\lint-csharp.ps1
            displayName: 'Run dotnet format'

  - stage: Test
    displayName: 'Unity tests'
    dependsOn: Lint
    condition: succeeded()
    jobs:
      - job: TestEditMode
        displayName: 'Unity EditMode tests'
        pool:
          ${{ if eq(parameters.agentMode, 'hosted') }}:
            vmImage: 'windows-2022'
          ${{ else }}:
            name: $(windowsAgentPool)
        variables:
          CI_PROJECT_DIR: '$(Build.SourcesDirectory)'
          TEST_PLATFORM: 'editmode'
          UNITY_TEST_RESULTS_PATH: 'artifacts/unity-editmode-results.xml'
          UNITY_TEST_LOG_PATH: 'artifacts/unity-editmode.log'
        steps:
          - checkout: self
            fetchDepth: 1
          - powershell: |
              if (-not (Test-Path -LiteralPath 'Tools/CI/test-unity.ps1' -PathType Leaf)) {
                throw 'Tools/CI/test-unity.ps1 was not found.'
              }
              & .\Tools\CI\test-unity.ps1
            displayName: 'Run Unity EditMode tests'
          - task: PublishTestResults@2
            displayName: 'Publish Unity test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'artifacts/unity-editmode-results.xml'
              searchFolder: '$(Build.SourcesDirectory)'
              testRunTitle: 'Unity EditMode tests'
              failTaskOnFailedTests: true
              publishRunAttachments: true
          - powershell: |
              $logPath = Join-Path $env:BUILD_SOURCESDIRECTORY 'artifacts/unity-editmode.log'
              if (Test-Path -LiteralPath $logPath -PathType Leaf) {
                for ($attempt = 1; $attempt -le 12; $attempt++) {
                  try {
                    $stream = [System.IO.File]::Open($logPath, 'Open', 'Read', 'None')
                    $stream.Dispose()
                    break
                  }
                  catch [System.IO.IOException] {
                    if ($attempt -eq 12) {
                      throw "Unity log is still locked after waiting: $logPath"
                    }
                    Start-Sleep -Seconds 5
                  }
                }
              }
            displayName: 'Wait for Unity log file release'
            condition: always()
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Unity test log'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/artifacts'
              ArtifactName: 'unity-editmode-artifacts'
              publishLocation: 'Container'

  - stage: Build
    displayName: 'Unity builds'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: BuildWindows
        displayName: 'Build Windows player'
        condition: and(succeeded(), ${{ eq(parameters.buildWindows, true) }})
        pool:
          ${{ if eq(parameters.agentMode, 'hosted') }}:
            vmImage: 'windows-2022'
          ${{ else }}:
            name: $(windowsAgentPool)
        variables:
          CI_PROJECT_DIR: '$(Build.SourcesDirectory)'
          BUILD_NAME: '$(buildName)'
          BUILD_PATH: '$(buildPath)'
          BUILD_TARGET: 'StandaloneWindows64'
          UNITY_LOG_ARTIFACT_PATH: 'artifacts/unity-StandaloneWindows64.log'
        steps:
          - checkout: self
            fetchDepth: 1
          - powershell: |
              if (-not (Test-Path -LiteralPath 'Tools/CI/build-unity.ps1' -PathType Leaf)) {
                throw 'Tools/CI/build-unity.ps1 was not found.'
              }
              & .\Tools\CI\build-unity.ps1
            displayName: 'Build Windows player'
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Windows build log'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/artifacts'
              ArtifactName: 'unity-StandaloneWindows64-artifacts'
              publishLocation: 'Container'

      - job: BuildMacos
        displayName: 'Build macOS player'
        condition: and(succeeded(), ${{ eq(parameters.agentMode, 'hosted') }}, ${{ eq(parameters.buildMacos, true) }})
        pool:
          vmImage: 'macos-latest'
        variables:
          CI_PROJECT_DIR: '$(Build.SourcesDirectory)'
          BUILD_NAME: '$(buildName)'
          BUILD_PATH: '$(buildPath)'
          BUILD_TARGET: 'StandaloneOSX'
        steps:
          - checkout: self
            fetchDepth: 1
          - bash: |
              set -euo pipefail
              chmod +x Tools/CI/build-unity.sh
              Tools/CI/build-unity.sh
            displayName: 'Build macOS player'

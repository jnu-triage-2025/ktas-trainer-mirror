name: ktas-trainer-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - '*'

parameters:
  - name: agentMode
    displayName: 'Agent mode'
    type: string
    default: selfHosted
    values:
      - selfHosted
      - hosted
  - name: buildWindowsClient
    displayName: 'Build Windows client'
    type: boolean
    default: true
  - name: buildWindowsDedicatedServer
    displayName: 'Build Windows dedicated server'
    type: boolean
    default: false
  - name: buildMacosClient
    displayName: 'Build macOS client'
    type: boolean
    default: true
  - name: buildMacosDedicatedServer
    displayName: 'Build macOS dedicated server'
    type: boolean
    default: false
  - name: mirrorAgentPool
    displayName: 'Self-hosted pool for code mirroring'
    type: string
    default: 'windowsAgentPool'
  # Enable this only for a deliberate, reviewed run. It overwrites the branches
  # already published on the mirror destination, which is required once after a
  # filtering change alters the rewritten history.
  - name: rebuildMirror
    displayName: 'Republish the code mirror after a filtering change'
    type: boolean
    default: false

variables:
  - group: ci-mirroring
  - name: buildName
    value: 'ktas-trainer'
  - name: buildPath
    value: 'Build'
  - name: windowsAgentPool
    value: 'windowsAgentPool'
  - name: macAgentPool
    value: 'macAgentPool'

stages:
  - stage: Mirror
    displayName: 'Code mirror'
    condition: and(succeeded(), ${{ eq(parameters.agentMode, 'selfHosted') }})
    jobs:
      - job: PushCodeMirror
        displayName: 'Create and push filtered Git mirror'
        pool:
          name: ${{ parameters.mirrorAgentPool }}
        steps:
          # The mirror reads every remote-tracking branch and tag, so a shallow
          # checkout cannot provide a complete source history.
          # clean: false keeps the untracked state file, which records the
          # source-to-mirror commit mapping and the last published refs. Without
          # it every run rewrites the whole history and then fails the push
          # because it no longer knows what it published last time.
          - checkout: self
            fetchDepth: 0
            persistCredentials: true
            clean: false
          - powershell: |
              $mirrorScript = Join-Path '$(Build.SourcesDirectory)' 'Tools\CI\mirror-code.ps1'
              if (-not (Test-Path -LiteralPath $mirrorScript -PathType Leaf)) {
                throw "Code mirror script was not found: $mirrorScript"
              }
              & $mirrorScript
            displayName: 'Create and push code mirror (Windows)'
            condition: eq(variables['Agent.OS'], 'Windows_NT')
            workingDirectory: '$(Build.SourcesDirectory)'
            env:
              GIT_HTTP_TOKEN: $(GIT_HTTP_TOKEN)
              ${{ if eq(parameters.rebuildMirror, true) }}:
                CODE_MIRROR_REBUILD: 'true'
          # --auto keeps most runs from repacking the whole source history, and
          # gc.autoDetach=false keeps the repack from outliving the job.
          - powershell: |
              git -c gc.autoDetach=false -c gc.autoPackLimit=12 gc --auto --prune=now
              git count-objects -vH
              foreach ($name in @('.git', 'Library', 'Temp', 'artifacts', 'build', 'Assets')) {
                $path = Join-Path '$(Build.SourcesDirectory)' $name
                if (Test-Path -LiteralPath $path) {
                  $sum = (Get-ChildItem -LiteralPath $path -Recurse -Force -File -ErrorAction SilentlyContinue |
                    Measure-Object -Property Length -Sum).Sum
                  Write-Host ("{0,-12} {1,10:N2} GB" -f $name, ($sum / 1GB))
                } else {
                  Write-Host ("{0,-12} {1,10}" -f $name, 'absent')
                }
              }
            displayName: 'Prune and measure mirror workspace (Windows)'
            condition: and(always(), eq(variables['Agent.OS'], 'Windows_NT'))
          - bash: |
              chmod +x Tools/CI/mirror-code.sh
              Tools/CI/mirror-code.sh
            displayName: 'Create and push code mirror (macOS)'
            condition: eq(variables['Agent.OS'], 'Darwin')
            env:
              GIT_HTTP_TOKEN: $(GIT_HTTP_TOKEN)
              ${{ if eq(parameters.rebuildMirror, true) }}:
                CODE_MIRROR_REBUILD: 'true'
          - bash: |
              git -c gc.autoDetach=false -c gc.autoPackLimit=12 gc --auto --prune=now
              git count-objects -vH
              du -sh -- .git Library Temp artifacts build Assets 2>/dev/null || true
            displayName: 'Prune and measure mirror workspace (macOS)'
            condition: and(always(), eq(variables['Agent.OS'], 'Darwin'))

  - stage: Lint
    displayName: 'C# lint'
    jobs:
      - job: LintCSharp
        displayName: 'Roslyn analyzer and format validation'
        pool:
          ${{ if eq(parameters.agentMode, 'hosted') }}:
            vmImage: 'windows-2022'
          ${{ else }}:
            name: $(windowsAgentPool)
        steps:
          # Every job of this pipeline shares one workspace on a self-hosted
          # agent, so cleaning here discards Unity's imported Library and package
          # cache as well as the code mirror state. Rebuilding those needs the
          # Unity package registry on every run, which makes the job fail
          # whenever that host is unreachable.
          # A shallow fetch marks that shared repository shallow, which the
          # mirror job then has to undo to see the full history again. Fetching
          # the full history costs nothing here because the mirror job already
          # put it in this very repository; only a fresh hosted agent needs the
          # shallow fetch.
          - checkout: self
            clean: false
            ${{ if eq(parameters.agentMode, 'hosted') }}:
              fetchDepth: 1
            ${{ else }}:
              fetchDepth: 0
          - powershell: |
              if (-not (Test-Path -LiteralPath 'Tools/CI/lint-csharp.ps1' -PathType Leaf)) {
                throw 'Tools/CI/lint-csharp.ps1 was not found.'
              }
              & .\Tools\CI\lint-csharp.ps1
            displayName: 'Run dotnet format'

  - stage: Test
    displayName: 'Unity tests'
    dependsOn: Lint
    condition: succeeded()
    jobs:
      - job: TestEditMode
        displayName: 'Unity EditMode tests'
        pool:
          ${{ if eq(parameters.agentMode, 'hosted') }}:
            vmImage: 'windows-2022'
          ${{ else }}:
            name: $(windowsAgentPool)
        variables:
          CI_PROJECT_DIR: '$(Build.SourcesDirectory)'
          TEST_PLATFORM: 'editmode'
          UNITY_TEST_RESULTS_PATH: 'artifacts/unity-editmode-results.xml'
          UNITY_TEST_LOG_PATH: 'artifacts/unity-editmode.log'
        steps:
          # Keeps the imported Library and package cache between runs, and keeps
          # the shared repository from being marked shallow; see the lint job.
          - checkout: self
            clean: false
            ${{ if eq(parameters.agentMode, 'hosted') }}:
              fetchDepth: 1
            ${{ else }}:
              fetchDepth: 0
          - powershell: |
              if (-not (Test-Path -LiteralPath 'Tools/CI/test-unity.ps1' -PathType Leaf)) {
                throw 'Tools/CI/test-unity.ps1 was not found.'
              }
              & .\Tools\CI\test-unity.ps1
            displayName: 'Run Unity EditMode tests'
          - task: PublishTestResults@2
            displayName: 'Publish Unity test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'artifacts/unity-editmode-results.xml'
              searchFolder: '$(Build.SourcesDirectory)'
              testRunTitle: 'Unity EditMode tests'
              failTaskOnFailedTests: true
              publishRunAttachments: false

  - stage: Build
    displayName: 'Unity builds'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - template: Tools/CI/azure-templates/unity-build-job.yml
        parameters:
          jobName: BuildWindowsClient
          displayName: 'Build Windows client'
          enabled: ${{ parameters.buildWindowsClient }}
          agentMode: ${{ parameters.agentMode }}
          host: windows
          buildTarget: StandaloneWindows64
          buildSubtarget: Player
          buildName: $(buildName)
          buildPath: $(buildPath)
          windowsAgentPool: $(windowsAgentPool)
          macAgentPool: $(macAgentPool)
      - template: Tools/CI/azure-templates/unity-build-job.yml
        parameters:
          jobName: BuildWindowsDedicatedServer
          displayName: 'Build Windows dedicated server'
          enabled: ${{ parameters.buildWindowsDedicatedServer }}
          agentMode: ${{ parameters.agentMode }}
          host: windows
          buildTarget: StandaloneWindows64
          buildSubtarget: Server
          buildName: $(buildName)-server
          buildPath: $(buildPath)
          windowsAgentPool: $(windowsAgentPool)
          macAgentPool: $(macAgentPool)
      - template: Tools/CI/azure-templates/unity-build-job.yml
        parameters:
          jobName: BuildMacosClient
          displayName: 'Build macOS client'
          enabled: ${{ parameters.buildMacosClient }}
          agentMode: ${{ parameters.agentMode }}
          host: macos
          buildTarget: StandaloneOSX
          buildSubtarget: Player
          buildName: $(buildName)
          buildPath: $(buildPath)
          windowsAgentPool: $(windowsAgentPool)
          macAgentPool: $(macAgentPool)
      - template: Tools/CI/azure-templates/unity-build-job.yml
        parameters:
          jobName: BuildMacosDedicatedServer
          displayName: 'Build macOS dedicated server'
          enabled: ${{ parameters.buildMacosDedicatedServer }}
          agentMode: ${{ parameters.agentMode }}
          host: macos
          buildTarget: StandaloneOSX
          buildSubtarget: Server
          buildName: $(buildName)-server
          buildPath: $(buildPath)
          windowsAgentPool: $(windowsAgentPool)
          macAgentPool: $(macAgentPool)
